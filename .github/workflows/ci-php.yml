name: CI PHP lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax (helpers + config + scripts)
        run: |
          set -e
          find helpers config scripts -name '*.php' \
            ! -path '*/vendor/*' \
            -print0 | xargs -0 -n1 php -l

  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: ffi, pdo_sqlite

      - name: Composer validate and install
        run: |
          set -e
          composer validate --strict
          composer install --no-dev --prefer-dist --no-interaction --no-progress
          php -r "exit(extension_loaded('ffi') && extension_loaded('pdo_sqlite') ? 0 : 1);"

  turso_config:
    runs-on: ubuntu-latest
    needs: [syntax]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Turso config check (no remote connection)
        env:
          PONDOK_DB_DRIVER: turso
        run: php scripts/ci_turso_config_check.php

  turso_remote_smoke:
    runs-on: ubuntu-latest
    needs: [composer]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: ffi, pdo_sqlite

      - name: Composer install (turso/libsql)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Turso remote read-only smoke
        env:
          PONDOK_DB_DRIVER: turso
          PONDOK_TURSO_REQUIRE_SYNC: '1'
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          mkdir -p storage
          php scripts/ci_turso_validate.php
